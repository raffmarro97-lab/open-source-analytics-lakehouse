
resources:
  jobs:
    github_analytics_pipeline:
      name: github-analytics-pipeline
      description: "GitHub Analytics Medallion Pipeline"

      # Prevent overlapping pipeline runs
      max_concurrent_runs: 1

      # Parameters shared across all notebook tasks
      parameters:
        - name: environment
          default: ${bundle.target}

        - name: organization
          default: databricks

      tasks:
        # Step 1: Ingest GitHub repositories into Bronze
        - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ../notebooks/01_BronzeIngestion.ipynb

        # Step 2: Prepare the latest Silver snapshot
        - task_key: silver_staging
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ../notebooks/02_SilverLightStaging.ipynb

        # Step 3: Detect changes between snapshots
        - task_key: change_detection
          depends_on:
            - task_key: silver_staging
          notebook_task:
            notebook_path: ../notebooks/03_ChangeDetection.ipynb

        # Step 4: Clean and validate Silver data
        - task_key: silver_cleaning
          depends_on:
            - task_key: change_detection
          notebook_task:
            notebook_path: ../notebooks/04_SilverCleaning.ipynb

        # Step 5: Build Gold SCD2 and repository metrics
        - task_key: gold_modeling
          depends_on:
            - task_key: silver_cleaning
          notebook_task:
            notebook_path: ../notebooks/05_GoldModeling.ipynb
